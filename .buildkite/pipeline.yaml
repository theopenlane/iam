env:
  APP_NAME: ${BUILDKITE_PIPELINE_SLUG}
  SONAR_HOST: "https://sonarcloud.io"

  # build settings
  CACHE_HOME: ${CACHE_HOME:-/var/lib/buildkite-agent/.cache}
  GOCACHE: ${GOCACHE:-$CACHE_HOME/go-build}
  GOMODCACHE: ${GOMODCACHE:-$CACHE_HOME/go/pkg/mod}
  GOLANGCI_LINT_CACHE: ${GOLANGCI_LINT_CACHE:-$CACHE_HOME/golangci-lint}
  CONFIG_HOME: /tmp
  GIT_CONFIG_GLOBAL: ${GIT_CONFIG_GLOBAL:-$CONFIG_HOME/.gitconfig}
  SONAR_USER_HOME: ${SONAR_USER_HOME:-$CONFIG_HOME/.sonar}
  SCANNER_WORKDIR_PATH: ${SCANNER_WORKDIR_PATH:-$CONFIG_HOME/sonar-scanner-work}

  # runner vars
  LARGE_RUNNER_QUEUE: ${LARGE_RUNNER_QUEUE:-self-hosted-garage-vms}
  SMALL_RUNNER_QUEUE: ${SMALL_RUNNER_QUEUE:-self-hosted-garage-vms}

# cache for hosted runners
cache:
  name: iam-go-cache
  size: 100g
  paths:
    - $GOCACHE
    - $GOMODCACHE
    - $GOLANGCI_LINT_CACHE

steps:
  - group: ":knife: Pre-check"
    key: "precheck"
    if_changed:
      - go.{mod,sum}
      - fgax/internal/mockery/**
      - Taskfile.yaml
      - .buildkite/**
    steps:
      - label: ":golang: go generate"
        key: "generate"
        agents:
          queue: $SMALL_RUNNER_QUEUE
        plugins:
          - docker#v5.14.0:
              image: "ghcr.io/theopenlane/build-image:latest"
              always-pull: true
              command: ["task", "ci"]
              propagate-environment: true
              propagate-uid-gid: true
              volumes:
                - $GOCACHE:$GOCACHE
                - $GOMODCACHE:$GOMODCACHE
              environment:
                - "GOTOOLCHAIN=auto"
  - group: ":test_tube: Tests"
    key: "tests"
    depends_on: "precheck"
    if_changed:
      - go.{mod,sum}
      - "**.go"
      - entfga/templates/**
      - Taskfile.yaml
      - .golangci.yaml
      - .buildkite/**
    steps:
      - label: ":golangci-lint: lint :lint-roller:"
        key: "lint"
        cancel_on_build_failing: true
        agents:
          queue: $LARGE_RUNNER_QUEUE
        plugins:
          - docker#v5.14.0:
              image: "ghcr.io/theopenlane/build-image:latest"
              always-pull: true
              command: ["task", "go:lint"]
              propagate-environment: true
              propagate-uid-gid: true
              volumes:
                - $GOCACHE:$GOCACHE
                - $GOMODCACHE:$GOMODCACHE
                - $GOLANGCI_LINT_CACHE:$GOLANGCI_LINT_CACHE
              environment:
                - "GOTOOLCHAIN=auto"
      - label: ":golang: go test"
        key: "go_test"
        agents:
          queue: $LARGE_RUNNER_QUEUE
        plugins:
          - docker#v5.14.0:
              image: "ghcr.io/theopenlane/build-image:latest"
              always-pull: true
              command: ["task", "go:test:cover"]
              propagate-environment: true
              propagate-uid-gid: true
              volumes:
                - $GOCACHE:$GOCACHE
                - $GOMODCACHE:$GOMODCACHE
        artifact_paths: ["coverage.out"]
      - label: ":test_tube: generate example"
        key: "example_generate"
        agents:
          queue: $LARGE_RUNNER_QUEUE
        plugins:
          - docker#v5.14.0:
              image: "ghcr.io/theopenlane/build-image:latest"
              always-pull: true
              workdir: "/fgax"
              command: ["task", "example:generate"]
              propagate-environment: true
              propagate-uid-gid: true
              volumes:
                - $GOCACHE:$GOCACHE
                - $GOMODCACHE:$GOMODCACHE
              environment:
                - "GOTOOLCHAIN=auto"
      - label: ":github: upload PR reports"
        key: "scan-upload-pr"
        if: build.pull_request.id != null
        depends_on: ["go_test"]
        agents:
          queue: $SMALL_RUNNER_QUEUE
        plugins:
          - cluster-secrets#v1.0.0:
              variables:
                SONAR_TOKEN: SONAR_TOKEN
          - artifacts#v1.11.0:
              download: "coverage.out"
              step: "go_test"
          - docker#v5.14.0:
              image: "sonarsource/sonar-scanner-cli:12.3"
              propagate-environment: true
              propagate-uid-gid: true
              environment:
                - "SONAR_TOKEN"
                - "SONAR_HOST_URL=$SONAR_HOST"
                - "SONAR_SCANNER_OPTS=-Dsonar.pullrequest.branch=$BUILDKITE_BRANCH -Dsonar.pullrequest.base=$BUILDKITE_PULL_REQUEST_BASE_BRANCH -Dsonar.pullrequest.key=$BUILDKITE_PULL_REQUEST"
      - label: ":github: upload reports"
        key: "scan-upload"
        if: build.branch == "main"
        depends_on: ["go_test"]
        agents:
          queue: $SMALL_RUNNER_QUEUE
        plugins:
          - cluster-secrets#v1.0.0:
              variables:
                SONAR_TOKEN: SONAR_TOKEN
          - artifacts#v1.11.0:
              download: coverage.out
              step: "go_test"
          - docker#v5.14.0:
              image: "sonarsource/sonar-scanner-cli:12.3"
              propagate-environment: true
              propagate-uid-gid: true
              environment:
                - "SONAR_TOKEN"
                - "SONAR_HOST_URL=$SONAR_HOST"
