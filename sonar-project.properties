sonar.projectKey=theopenlane_iam
sonar.organization=theopenlane

sonar.projectName=iam
sonar.projectVersion=1.0

sonar.sources=.

sonar.exclusions=
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=entfga/_examples/**,fgax/internal/mockery/**

sonar.issue.ignore.multicriteria=tests
sonar.issue.ignore.multicriteria.tests.ruleKey=*
sonar.issue.ignore.multicriteria.tests.resourceKey=**/*_test.go

sonar.sourceEncoding=UTF-8
sonar.go.coverage.reportPaths=coverage.out